<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOPSIE Copilot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="extension-container">
    <header class="header">
      <div class="brand">
        <span class="logo">⚡</span>
        <div>
          <h1>OOPSIE</h1>
          <p class="tagline">Paste chaos. Get clarity.</p>
        </div>
      </div>
      <span class="badge">Open Source v1.0</span>
    </header>

    <main class="content">
      <div class="form-group">
        <label for="errorInput">Pasted Error / Stack Trace / Build Log:</label>
        <textarea id="errorInput" placeholder="Paste your error message here..."></textarea>
      </div>

      <div class="row">
        <div class="form-group flex-1">
          <label for="frameworkSelect">Framework / Environment:</label>
          <select id="frameworkSelect">
            <option value="auto">⚡ Auto-Detect</option>
            <option value="react">React</option>
            <option value="nextjs">Next.js</option>
            <option value="supabase">Supabase</option>
            <option value="vercel">Vercel</option>
            <option value="firebase">Firebase</option>
            <option value="node">Node.js / npm</option>
            <option value="python">Python</option>
          </select>
        </div>
        <button id="analyzeBtn" class="btn btn-primary">Analyze Chaos 🪄</button>
      </div>

      <div id="results" class="results-panel hidden">
        <div class="card summary-card">
          <h3>💡 What Happened (Plain English)</h3>
          <p id="plainEnglishText"></p>
        </div>

        <div class="card cause-card">
          <h3>🔍 Likely Cause</h3>
          <p id="likelyCauseText"></p>
        </div>

        <div class="card prompt-card">
          <div class="card-header">
            <h3>🤖 AI Repair Prompt</h3>
            <button id="copyPromptBtn" class="btn btn-sm">Copy Prompt 📋</button>
          </div>
          <pre id="repairPromptText"></pre>
        </div>

        <div class="card verification-card">
          <h3>✅ Verification Checklist</h3>
          <ul id="verificationList"></ul>
        </div>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
