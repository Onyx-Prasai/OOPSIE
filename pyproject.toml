[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oopsie-ai"
version = "0.1.0"
description = "Open-source AI error recovery model, dataset, and inference tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "transformers>=4.46,<5",
  "torch>=2.4"
]
training = [
  "accelerate>=1.1,<2",
  "datasets>=3,<5",
  "peft>=0.13,<1",
  "PyYAML>=6,<7",
  "torch>=2.4",
  "transformers>=4.46,<5"
]
test = [
  "pytest>=8,<9"
]

[project.scripts]
oopsie = "inference.cli:main"

[tool.setuptools.packages.find]
include = ["inference*"]
